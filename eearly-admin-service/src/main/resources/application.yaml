server:
  port: 9000

logging:
  file:
    name: ${LOGGING_FILE_PATH}
  loggers:
    http:
      enabled: true
      log-response: true
      log-authorization-header: false
    method:
      enabled: true

spring:
  application:
    name: eearly-admin-service

  datasource:
    url: ${DB_URL}
    username: ${DB_SERVICE_USER}
    password: ${DB_SERVICE_PASS}
    hikari:
      schema: ${DB_SCHEMA}
  flyway:
    url: ${DB_URL}
    user: ${DB_FLYWAY_USER}
    password: ${DB_FLYWAY_PASS}
    locations: ${DB_FLYWAY_MIGRATION_PATHS:classpath:db/migration}
    schemas:
      - ${DB_SCHEMA}
      - ${DB_AUDIT_SCHEMA}
    default-schema: ${DB_SCHEMA}
    out-of-order: true
    placeholders:
      schema: ${DB_SCHEMA}
      audit_schema: ${DB_AUDIT_SCHEMA}
      apnea_service_endpoint: ${APNEA_SERVICE_ENDPOINT:http://localhost:3001}
  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        default_schema: ${DB_SCHEMA}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

  # SMTP server for outgoing e-mail. Failed sends are logged and never fail a request, so an unreachable or
  # unconfigured server only means no e-mail.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:60000}
          writetimeout: ${MAIL_TIMEOUT_MS:60000}

  grpc:
    client:
      channels:
        mobile-backend:
          address: ${GRPC_ADDRESS:static://localhost:9090}
          max-inbound-message-size: ${GRPC_MAX_INBOUND_MESSAGE_SIZE:10MB}
          max-inbound-metadata-size: ${GRPC_MAX_INBOUND_METADATA_SIZE:10MB}

springdoc:
  swagger-ui:
    url: ${SWAGGER_URL:/v3/api-docs}

service:
  domain: ${SERVICE_DOMAIN_URL}

qrcode:
  # App-link page the QR code points at (for example https://app.example.org/onboarding); blank = the onboarding URL
  # of the request itself, which app versions before the link handler need.
  link-base-url: ${QR_CODE_LINK_BASE_URL:}

email:
  # Sender address of every message
  from: ${EMAIL_FROM:noreply@example.org}
  # Application name shown as the sender name and in the message text
  app-name: ${EMAIL_APP_NAME:eEarly}
  # Comma-separated recipient domains; messages to any other domain are skipped. * allows all.
  allowed-recipient-domains: ${EMAIL_ALLOWED_RECIPIENT_DOMAINS:*}
  # Optional link to the mobile application, shown in the QR code message
  app-download-url: ${EMAIL_APP_DOWNLOAD_URL:}
  # Logo shown in the messages (classpath: or file: location); empty sends the messages without a logo
  logo: ${EMAIL_LOGO:classpath:images/email-logo.png}
  templates:
    # Folder of the templates (classpath: or file: location), so a deployment can brand them
    path: ${EMAIL_TEMPLATE_FOLDER:classpath:templates/email/}
  qrcode:
    # Slovenian (default language) template; the English one is the same name with -en before the extension
    template: ${EMAIL_TEMPLATE:qr-code-email.html}

mobile:
  service:
    base-url: ${MOBILE_SERVICE_BASE_URL}
  keycloak:
    base-url: ${MOBILE_KEYCLOAK_BASE_URL}
    realm: ${MOBILE_KEYCLOAK_REALM}
    admin-client:
      id: ${MOBILE_KEYCLOAK_ADMIN_CLIENT_ID:admin-service}
      secret: ${MOBILE_KEYCLOAK_ADMIN_CLIENT_SECRET}

algorithm:
  api:
    default-timeout-seconds: ${BENTOML_TIMEOUT:3600}
    async-poll-interval-ms: ${BENTOML_POLL_INTERVAL:5000}
    api-key: ${BENTOML_API_KEY:}
    basic-auth:
      username: ${ALGORITHM_BASIC_AUTH_USERNAME:}
      password: ${ALGORITHM_BASIC_AUTH_PASSWORD:}
    verify-ssl: ${BENTOML_VERIFY_SSL:true}

admin:
  keycloak:
    # Client whose client roles authorize calls to this service (resource_access.<client id>.roles).
    ui-client-id: ${ADMIN_KEYCLOAK_UI_CLIENT_ID:eearly-admin-ui}

patient:
  demographics-sync:
    # Send every patient's demographics to the mobile backend once, after startup (backfill and retry).
    on-startup: ${PATIENT_DEMOGRAPHICS_SYNC_ON_STARTUP:true}
