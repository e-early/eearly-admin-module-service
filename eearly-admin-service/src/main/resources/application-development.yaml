spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/eearly-admin_db
    username: eearly-admin
    password: eearly-admin
  flyway:
    url: jdbc:postgresql://localhost:5432/eearly-admin_db
    user: eearly-admin
    password: eearly-admin
    locations: classpath:db/migration,classpath:/db/test-data
    schemas:
      - eearly_admin
      - eearly_admin_audit
    default-schema: eearly_admin
    placeholders:
      schema: eearly_admin
      audit_schema: eearly_admin_audit
      apnea_service_endpoint: ${APNEA_SERVICE_ENDPOINT:http://localhost:3001}
  jpa:
    properties:
      hibernate:
        default-schema: eearly_admin
  security:
    cors:
      allowed-origins: "*"
      allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    oauth2:
      resourceserver:
        jwt:
          # Replace with your Keycloak realm's JWKS endpoint
          # See: https://github.com/result-si/eearly-keycloak for setup
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/realms/eearly/protocol/openid-connect/certs}

  grpc:
    client:
      channels:
        mobile-backend:
          address: ${GRPC_ADDRESS:static://localhost:8082}
          max-inbound-message-size: ${GRPC_MAX_INBOUND_MESSAGE_SIZE:10MB}
          max-inbound-metadata-size: ${GRPC_MAX_INBOUND_METADATA_SIZE:10MB}

logging:
  file:
    name: logs/eearly-admin-service.log

service:
  domain: ${SERVICE_DOMAIN_URL:http://localhost:9000}

mobile:
  service:
    # See: https://github.com/result-si/eearly-mobile for setup
    base-url: ${MOBILE_SERVICE_BASE_URL:http://localhost:8083/api/v1}
  keycloak:
    base-url: ${MOBILE_KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${MOBILE_KEYCLOAK_REALM:eearly-mobile}
    admin-client:
      id: admin-service
      secret: ${MOBILE_KEYCLOAK_ADMIN_CLIENT_SECRET:<your-mobile-keycloak-admin-secret>}

algorithm:
  api:
    default-timeout-seconds: ${BENTOML_TIMEOUT:3600}
    async-poll-interval-ms: ${BENTOML_POLL_INTERVAL:5000}
    api-key: ${BENTOML_API_KEY:}
    basic-auth:
      username: ${ALGORITHM_BASIC_AUTH_USERNAME:}
      password: ${ALGORITHM_BASIC_AUTH_PASSWORD:}
    verify-ssl: ${BENTOML_VERIFY_SSL:true}
